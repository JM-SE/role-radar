[project]
name = "role-radar"
version = "0.1.0"
description = "Pipeline personal de búsqueda laboral: colecta, normaliza, deduplica y prioriza oportunidades de software engineering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "httpx",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
]

[project.scripts]
role-radar = "role_radar.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/role_radar"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
per-file-ignores = {"src/role_radar/continuous_acquisition/*.py" = ["E501"], "alembic/versions/f10_1b_continuous_acquisition.py" = ["E501"], "src/role_radar/evaluation/profile_relevance/*.py" = ["E501", "RUF002", "RUF003"], "tests/unit/test_profile_relevance_*.py" = ["E501", "RUF002", "RUF003", "RUF005", "RUF059", "F841", "B", "SIM"]}

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
